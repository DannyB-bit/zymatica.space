[package]
name = "zk-lora-operator"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.9"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-std = "0.4.0"
ark-relations = "0.4.0"
ark-groth16 = "0.4.0"
ark-bn254 = "0.4.0"
rand = "0.8"
hex = "0.4"
ark-serialize = "0.4.0"
ark-snark = "0.4.0"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]
