<!doctype html>
<html lang="en">
<head>

    <title>ZYMATICA // Desktop Studio & Neural Edge Console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2352d9ff'/%3E%3Cpath d='M16 15h34L26 49h22' fill='none' stroke='%2307111f' stroke-width='8' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #07111f;
            --surface: rgba(15, 30, 50, 0.88);
            --border: rgba(148, 196, 255, 0.16);
            --text: #edf6ff;
            --muted: #92a9c0;
            --cyan: #52d9ff;
            --gold: #ffd700;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2rem; color: var(--gold); margin-bottom: 0.5rem; }
        p { color: var(--muted); margin-bottom: 2rem; line-height: 1.6; }
        .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        a {
            background: rgba(82, 217, 255, 0.12);
            color: var(--cyan);
            border: 1px solid var(--border);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        a:hover { background: var(--cyan); color: #07111f; }
    </style>
</head>
